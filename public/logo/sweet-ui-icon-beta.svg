    <linearGradient id="glaze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBC3D6"/>
      <stop offset="1" stop-color="#F6A5C0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
