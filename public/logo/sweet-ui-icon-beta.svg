      <stop offset="0.6" stop-color="#5FACD3" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5FACD3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dough" x1="0" y1="0" x2="1" y2="1">
