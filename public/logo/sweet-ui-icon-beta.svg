    </filter>
    <mask id="hole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="95" fill="#000"/>
    </mask>
  </defs>

  <rect x="2" y="2" width="1020" height="1020" rx="230" fill="url(#bg)" stroke="#E2E8F0" stroke-width="4"/>
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>

