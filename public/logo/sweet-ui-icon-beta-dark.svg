      <circle cx="257" cy="512" r="50"/>
      <circle cx="291" cy="385" r="50"/>
      <circle cx="385" cy="291" r="50"/>
      <circle cx="512" cy="257" r="50"/>
      <circle cx="640" cy="291" r="50"/>
      <circle cx="733" cy="385" r="50"/>
    </g>
    <!-- Brillo -->
    <path d="M300 400 Q330 300 430 270" fill="none" stroke="#fff" stroke-width="18" stroke-linecap="round" opacity="0.6"/>
