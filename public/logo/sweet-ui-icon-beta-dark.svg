    <linearGradient id="glaze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBC3D6"/>
      <stop offset="1" stop-color="#F6A5C0"/>
    </linearGradient>
    <mask id="hole">
      <rect width="1024" height="1024" fill="#fff"/>
      <circle cx="512" cy="512" r="95" fill="#000"/>
    </mask>
  </defs>

  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <circle cx="512" cy="512" r="470" fill="url(#glow)"/>

  <g mask="url(#hole)">
