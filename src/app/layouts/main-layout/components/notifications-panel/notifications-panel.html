@if (layout.notificationsOpen()) {
    <div (click)="layout.closeNotifications()" class="fixed inset-0 z-50 bg-slate-900/20 backdrop-blur-sm touch-none" aria-hidden="true"></div>
}
<aside class="fixed top-0 right-0 z-[60] h-[100dvh] w-80 sm:w-96 bg-base-100 shadow-2xl border-l border-(--border-color-1)/40 transition-transform duration-300 ease-in-out transform translate-x-full flex flex-col" [class.translate-x-0!]="layout.notificationsOpen()">
    <div class="flex items-center justify-between px-6 py-4 shrink-0 h-16">
        <h3 class="font-bold text-(--text-color) text-[15px]">{{ 'layout.notifications' | translate }}</h3>
        <button (click)="layout.closeNotifications()" class="size-9 inline-flex items-center justify-center shrink-0 -mr-2 rounded-xl hover:bg-(--bg-2) text-(--secondary-text) transition hover:cursor-pointer" [attr.aria-label]="'layout.closeNotifications' | translate">
            <app-tabler-icon name="close" [size]="20" />
        </button>
    </div>
    <div class="flex items-center justify-between px-6 py-2.5 border-y border-(--border-color-1)/40 bg-(--bg-2) shrink-0">
        <span class="text-[12px] font-medium text-(--secondary-text)">{{ 'layout.unread' | translate: { count: unreadCount() } }}</span>
        <button (click)="markAllAsRead()" class="text-[12px] font-medium text-(--primary-color) hover:text-(--text-color) hover:underline hover:cursor-pointer transition-all outline-none flex items-center gap-1">
            <app-tabler-icon name="checks" [size]="14" />
            {{ 'layout.markAllRead' | translate }}
        </button>
    </div>

    <div class="flex-1 overflow-y-auto overscroll-contain">
        @for (notification of notifications(); track notification.id) {
            <button type="button" (click)="markAsRead(notification.id)" class="w-full text-left px-6 py-4 border-b border-(--border-color-1)/40 hover:bg-(--bg-2) focus-visible:bg-(--bg-2) outline-none transition cursor-pointer flex gap-4 items-start relative group">
                @if (!notification.read) {
                    <span class="dot-live absolute left-2 top-[23px] size-1.5" style="--dot-color: var(--primary-color)" aria-hidden="true"></span>
                }
                <span class="w-10 h-10 rounded-full bg-(--primary-color)/10 text-(--primary-color) border border-(--border-color-1)/40 flex items-center justify-center shrink-0 font-bold text-sm select-none" aria-hidden="true">
                    {{ notification.author | initials }}
                </span>
                <span class="flex-1 min-w-0">
                    <span class="flex justify-between items-baseline mb-0.5">
                        <span class="text-[14px] font-bold text-(--text-color) truncate">{{ notification.author }}</span>
                        <span class="text-[11px] font-medium text-(--primary-color) shrink-0 ml-2">{{ notification.time.key | translate: notification.time.params }}</span>
                    </span>
                    <span class="block text-[13px] text-(--secondary-text) line-clamp-2 leading-snug">
                        {{ notification.message | translate }}
                    </span>
                </span>
            </button>
        }
    </div>
</aside>
