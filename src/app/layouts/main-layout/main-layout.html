<div class="relative h-[100dvh] flex flex-col bg-base-100 text-(--text-color) overflow-hidden">
  <app-topbar variant="mobile" />

  @if (layout.mobileOpen()) {
    <div (click)="layout.closeMobileSidebar()" class="fixed inset-0 z-30 bg-slate-900/40 backdrop-blur-sm lg:hidden touch-none" aria-hidden="true"></div>
  }

  <div class="flex flex-1 overflow-hidden relative">
    <app-sidebar />

    <div class="flex-1 flex flex-col min-w-0 h-full bg-base-100">
        <app-topbar variant="desktop" />

        <main #content class="relative flex-1 overflow-y-auto flex flex-col bg-base-200 overscroll-contain">
            <router-outlet></router-outlet>
        </main>
    </div>
  </div>
</div>

<app-chat-launcher />
<app-notifications-panel />
<app-dialog-host />
