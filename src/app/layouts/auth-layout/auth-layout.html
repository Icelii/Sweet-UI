<div class="grid lg:grid-cols-5 2xl:grid-cols-[minmax(0,1fr)_40rem] h-dvh bg-base-100 text-(--text-color) font-sans">
  <div class="hidden lg:flex lg:col-span-3 2xl:col-span-1 relative overflow-hidden items-center justify-center bg-linear-to-br from-primary/25 via-secondary/20 to-accent/25">
    <div class="absolute -top-[10%] -left-[10%] size-[clamp(24rem,32vw,60rem)] rounded-full bg-primary/30 blur-[clamp(4rem,6vw,10rem)]"></div>
    <div class="absolute -bottom-[15%] -right-[5%] size-[clamp(28rem,36vw,68rem)] rounded-full bg-accent/30 blur-[clamp(4rem,6vw,10rem)]"></div>
    <div class="absolute top-1/3 right-1/4 size-[clamp(18rem,24vw,44rem)] rounded-full bg-secondary/25 blur-[clamp(4rem,6vw,10rem)]"></div>
    <img [src]="logo()" [alt]="'auth.decorativeImage' | translate" class="relative size-[clamp(14rem,16vw,26rem)] object-contain drop-shadow-xl" />
  </div>

  <div class="w-full min-w-0 lg:col-span-2 2xl:col-span-1 flex flex-col px-4 sm:px-8 lg:px-10 xl:px-16 justify-between h-full overflow-y-auto">
    <div class="flex-1 flex flex-col max-w-[520px] w-full mx-auto mt-6 sm:mt-10 md:mt-16">
      <div class="mb-8 sm:mb-10 flex items-center justify-between gap-2">
        <a routerLink="/" class="flex items-center gap-2 sm:gap-3 min-w-0 outline-none" [attr.aria-label]="brand.name">
          <img [src]="logo()" alt="" class="h-9 w-9 sm:h-10 sm:w-10 shrink-0 object-contain" />
          <span class="font-heading font-bold text-lg sm:text-xl truncate">{{ brand.name }}</span>
        </a>

        <div class="flex items-center gap-1 sm:gap-2 shrink-0">
          <div class="dropdown dropdown-end">
            <button type="button" tabindex="0" class="btn h-10 min-h-0 px-2.5 sm:px-3 gap-1.5 sm:gap-2 rounded-full border-2 border-(--border-color-1)/40 bg-transparent shadow-none text-(--secondary-text) hover:text-(--primary-color)" [attr.aria-label]="'layout.switchLanguage' | translate">
              <app-flag-icon [language]="i18n.language()" [size]="18" />
              <span class="text-xs font-semibold uppercase">{{ i18n.language() }}</span>
              <app-tabler-icon name="chevron-down" [size]="14" [stroke]="2.5" />
            </button>
            <ul tabindex="0" class="dropdown-content menu z-50 mt-2 w-40 p-1 rounded-box bg-base-100 border border-(--border-color-1)/40 shadow-lg">
              @for (language of i18n.languages; track language) {
                <li>
                  <button type="button" (click)="selectLanguage(language)" class="flex items-center gap-2 text-[13px] font-medium" [class]="i18n.language() === language ? 'text-(--text-color)' : 'text-(--secondary-text)'" [attr.aria-pressed]="i18n.language() === language">
                    <app-flag-icon [language]="language" />
                    <span class="flex-1 text-left">{{ languageNames[language] }}</span>
                    @if (i18n.language() === language) {
                      <app-tabler-icon name="check" [size]="16" class="text-(--primary-color)" />
                    }
                  </button>
                </li>
              }
            </ul>
          </div>

          <app-theme-toggle buttonClass="w-10 h-10 min-h-0 bg-transparent shadow-none" />
        </div>
      </div>

      <div class="lg:my-auto lg:pb-10">
        <router-outlet />
      </div>
    </div>

    <div class="mt-8 pb-[max(1rem,env(safe-area-inset-bottom))]">
      <p class="text-[11px] text-center text-(--secondary-text) font-medium">
        {{ 'auth.copyright' | translate: { year: currentYear, app: brand.name } }}
      </p>
    </div>
  </div>
</div>
